android {
    namespace = "org.shizuku.nfc"
    compileSdk = libs.versions.compileSdk.get().toInteger()
    buildToolsVersion = "36.0.0"

    defaultConfig {
        applicationId = "org.shizuku.nfc"
        minSdk = libs.versions.minSdk.get().toInteger()
        targetSdk = libs.versions.targetSdk.get().toInteger()
        versionCode = 3
        versionName = "1.1.0"
    }

    signingConfigs {
        release {
            def keystorePath = project.findProperty("KEYSTORE_FILE") ?: System.getenv("KEYSTORE_FILE")
            if (keystorePath && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword project.findProperty("KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD")
                keyAlias project.findProperty("KEY_ALIAS") ?: System.getenv("KEY_ALIAS")
                keyPassword project.findProperty("KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD")
            } else {
                // 默认回退至 Android 调试证书自动签名，保证日常构建的 release APK 可直接安装
                initWith(signingConfigs.debug)
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
            minifyEnabled = false
            shrinkResources = false
        }
        release {
            minifyEnabled = false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose = true
        aidl = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled = true
    }
}

